name: Build integration archive

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build archive and checksum
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: ef-ble-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/*
          if-no-files-found: error
